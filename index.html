<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ANO KAWASHIMA 川島県鉄道UNO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{
  --bg:#0f1b2d;--bg2:#16263d;--panel:#1d3150;--line:#2c4468;--text:#eef3fa;--sub:#9fb2cc;
  --accent:#ffb020;--gate:#ff8a1f;--ok:#3ccf7a;--ng:#ff5a6a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(ellipse at top,#1b3152,var(--bg) 70%);color:var(--text);
  font-family:"Noto Sans JP",system-ui,sans-serif;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}

/* ===== Title / Lobby ===== */
.screen{max-width:960px;margin:0 auto;padding:16px}
.logo{text-align:center;margin:28px 0 8px}
.logo h1{margin:0;font-size:clamp(38px,9vw,72px);font-weight:900;letter-spacing:.04em;
  background:linear-gradient(90deg,#4fb3ff,#ffd34d,#ff7a59);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{margin:4px 0 0;color:var(--sub)}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}
.box h2{margin:0 0 10px;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input[type=text]{background:#0d1828;border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;font-size:16px;font-family:inherit;min-width:0}
.btn{background:#2a4a78;color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:700}
.btn:hover{filter:brightness(1.15)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.primary{background:linear-gradient(180deg,#2f8cff,#1a64d1)}
.btn.warn{background:linear-gradient(180deg,#ffb63b,#e88700);color:#2a1700}
.btn.danger{background:#b8344a}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.code{font-size:34px;font-weight:900;letter-spacing:.2em;color:var(--accent)}
.plist{list-style:none;padding:0;margin:8px 0}
.plist li{padding:8px 10px;background:#152640;border-radius:8px;margin:4px 0;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--sub);font-size:13px}
.err{color:var(--ng);font-size:14px;min-height:1em}

/* ===== Game ===== */
#game{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:rgba(0,0,0,.25);border-bottom:1px solid var(--line);flex-wrap:wrap}
.topbar .title{font-weight:900;color:var(--accent)}
.players{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.pchip{background:#152640;border:2px solid transparent;border-radius:10px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:center}
.pchip.turn{border-color:var(--accent);box-shadow:0 0 12px rgba(255,176,32,.5)}
.pchip .n{font-weight:900;font-size:15px}
.pchip .kw{background:var(--ng);color:#fff;border-radius:6px;padding:0 5px;font-size:11px;font-weight:900}
.pchip.me{background:#203b63}
.dir{font-size:20px;color:var(--accent)}
.table{flex:1;display:flex;gap:16px;padding:12px;align-items:center;justify-content:center;flex-wrap:wrap;overflow:auto;min-height:0}
.pile{display:flex;gap:16px;align-items:center}
.deck{width:110px;height:160px;border-radius:12px;background:repeating-linear-gradient(45deg,#1f4f8f 0 10px,#1a4176 10px 20px);border:3px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.deck small{font-weight:400;font-size:12px;opacity:.85}
.deck.can{animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,176,32,.45)}}
.info{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;width:min(340px,100%)}
.info h3{margin:0 0 6px;font-size:14px;color:var(--sub);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.lchip{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700;color:#fff;background:var(--c);text-shadow:0 1px 1px rgba(0,0,0,.35)}
.req{margin-top:8px;padding:6px 8px;border-radius:8px;background:#3a2a0c;color:#ffd27a;font-size:13px}
.log{margin-top:10px;max-height:120px;overflow:auto;font-size:12px;color:var(--sub);border-top:1px solid var(--line);padding-top:6px}
.log div{padding:1px 0}
.status{text-align:center;font-weight:700;padding:6px;min-height:32px}
.status.myturn{color:var(--accent)}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:4px 8px}
.kwbtn{background:linear-gradient(180deg,#ff5a6a,#d22a45);color:#fff;font-weight:900;font-size:17px;letter-spacing:.05em}
.kwbtn.on{background:#555}
.hand{display:flex;gap:6px;overflow-x:auto;padding:10px 12px 16px;background:rgba(0,0,0,.25);border-top:1px solid var(--line);min-height:186px;align-items:flex-end}
.hand .card{flex:0 0 auto;transition:transform .12s}
.hand .card.playable{cursor:pointer}
.hand .card.playable:hover{transform:translateY(-10px)}
.hand .card.dim{filter:brightness(.55) saturate(.6)}
.hand .card.drawn{outline:3px dashed var(--accent);outline-offset:2px}

/* ===== Card ===== */
.card{width:110px;height:160px;border-radius:12px;background:#fff;color:#1a1a1a;position:relative;overflow:hidden;
  box-shadow:0 6px 14px rgba(0,0,0,.4);display:flex;flex-direction:column;border:3px solid #fff;user-select:none}
.card .band{background:var(--c);color:#fff;padding:4px 6px;font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px;min-height:26px;text-shadow:0 1px 1px rgba(0,0,0,.3)}
.card .mk{background:#fff;color:var(--c);border-radius:4px;padding:0 3px;font-weight:900;font-size:11px;text-shadow:none}
.card .body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center}
.card .num{border:2px solid var(--c);color:var(--c);border-radius:5px;font-weight:900;font-size:12px;padding:0 4px;margin-bottom:4px}
.card .st{font-weight:900;font-size:20px;line-height:1.15;word-break:break-all}
.card .st.s{font-size:16px}.card .st.xs{font-size:13px}
.card .foot{background:var(--c);height:8px}
.card .tag{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-weight:900;font-size:12px;padding:3px 0;color:#fff;background:#222}
.card.skip .tag{background:#2d2d2d}
.card.rev .tag{background:#6a2bd1}
.card.depot{background:#2c2c2c;color:#fff}
.card.depot .body .big{font-size:36px;font-weight:900;color:#ffd34d}
.card.depot .body .lbl{font-weight:900;font-size:15px}
.card.depot .body .near{font-size:11px;opacity:.8}
.card.gate{background:linear-gradient(160deg,#ffb04a,#ff7a12);color:#3a1a00;border-color:#ffe0b8}
.card.gate .band{background:#c75500}
.card.gate .gi{font-size:13px;font-weight:900;border:2px solid #3a1a00;border-radius:6px;padding:0 6px;margin-bottom:6px}
.card.ticket{background:repeating-linear-gradient(0deg,#d8f0dc 0 3px,#c6e8cc 3px 6px);color:#163b20;border-color:#e8fff0}
.card.ticket .band{background:#1f7a3c}
.card.ticket .tk{font-size:22px;font-weight:900;letter-spacing:.1em}
.card.ticket .tks{font-size:11px}
.card.big{width:150px;height:218px}
.card.big .st{font-size:28px}.card.big .st.s{font-size:22px}.card.big .st.xs{font-size:18px}
.card.big .band{font-size:13px}
.card.big .num{font-size:15px}

/* ===== Modal ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .inner{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:640px;width:100%;max-height:85vh;overflow:auto}
.linegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:10px 0}
.linegrid button{background:var(--c);color:#fff;border:none;border-radius:10px;padding:10px;font-weight:700;text-align:left;text-shadow:0 1px 1px rgba(0,0,0,.35);font-size:14px}
.linegrid button small{display:block;font-weight:400;font-size:11px;opacity:.9}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#ff3b55;color:#fff;font-weight:900;font-size:clamp(24px,6vw,44px);padding:10px 28px;border-radius:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:pop 1.6s forwards;pointer-events:none}
@keyframes pop{0%{transform:translateX(-50%) scale(.5);opacity:0}15%{transform:translateX(-50%) scale(1.1);opacity:1}25%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.tcwrap{display:flex;flex-direction:column;align-items:center;gap:6px}
.byline{font-size:13px;font-weight:700;padding:3px 12px;border-radius:999px;background:#152640;border:2px solid var(--pc,#555);white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.byline .dot{color:var(--pc)}
.pchip{border-left:6px solid var(--pc)!important}
.pchip.flash{animation:flash .8s}
@keyframes flash{0%{transform:scale(1)}30%{transform:scale(1.12);box-shadow:0 0 0 5px var(--pc)}100%{transform:scale(1)}}
.fly{position:fixed;z-index:40;pointer-events:none;transform-origin:top left;transition:transform .55s cubic-bezier(.2,.8,.25,1),opacity .3s}
.fly.land{opacity:0;transition:opacity .45s .35s}
.fly .who{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--pc);color:#111;font-weight:900;font-size:14px;padding:3px 12px;border-radius:999px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.4)}
.flydraw{position:fixed;z-index:39;width:56px;height:80px;margin:-40px 0 0 -28px;border-radius:8px;background:repeating-linear-gradient(45deg,#1f4f8f 0 8px,#1a4176 8px 16px);border:2px solid #fff;color:#ffd34d;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center;pointer-events:none;transition:transform .55s ease-in,opacity .55s ease-in}
.rules h3{margin:14px 0 4px;color:var(--accent);font-size:15px}
.rules p,.rules li{font-size:14px;line-height:1.7}
.set label{display:inline-flex;align-items:center;gap:4px;margin:3px 8px 3px 0;font-size:14px}
.set .lchk{display:flex;flex-wrap:wrap;gap:2px 0;margin:8px 0}
.set select{padding:8px;border-radius:8px;background:#0d1828;color:#fff;border:1px solid var(--line);font-family:inherit;font-size:14px;max-width:100%}
.avprev{width:56px;height:56px;border-radius:10px;border:3px solid #fff;background:linear-gradient(135deg,#ffb020,#1b2c47);display:flex;align-items:center;justify-content:center;font-size:30px;overflow:hidden}
.avprev img,.av img{width:100%;height:100%;object-fit:cover;border-radius:6px}
.iconpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.iconpick button{width:42px;height:42px;font-size:24px;border-radius:8px;border:2px solid transparent;background:#0d1828;padding:0}
.iconpick button.sel{border-color:var(--accent);background:#2a3d5c}
.plist .li-av{display:inline-flex;width:28px;height:28px;border-radius:6px;overflow:hidden;align-items:center;justify-content:center;background:#24395a;margin-right:6px;vertical-align:middle;font-size:18px}
.plist .li-av img{width:100%;height:100%;object-fit:cover}
.kick{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;border:2px solid #fff;background:#b8344a;color:#fff;font-size:12px;font-weight:900;cursor:pointer;pointer-events:auto;z-index:5;padding:0;line-height:1}
.plate .av{overflow:hidden}
.swapb{position:absolute;right:4px;top:30px;background:#ffe14d;color:#5a3a00;font-size:10px;font-weight:900;border-radius:4px;padding:0 4px;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.card.big .swapb{font-size:12px;top:36px}
#btnCatch{animation:kwp .6s ease-in-out infinite alternate;font-size:15px;box-shadow:0 0 0 3px #fff,0 6px 16px rgba(0,0,0,.5)}
.tgtgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:12px 0}
.tgtgrid button{display:flex;align-items:center;gap:10px;background:#152640;border:2px solid var(--pc);color:#fff;border-radius:12px;padding:10px;font-family:inherit;font-weight:700;font-size:15px;text-align:left}
.tgtgrid .ta{width:40px;height:40px;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px;background:linear-gradient(135deg,var(--pc),#1b2c47);flex:0 0 auto}
.tgtgrid .ta img{width:100%;height:100%;object-fit:cover}
.hand .card.jump{box-shadow:0 0 0 3px #ff8a1f,0 0 22px 4px rgba(255,138,31,.8);animation:jmp .5s ease-in-out infinite alternate}
.hand .card.jump::before{content:"⚡ジャンプ!";position:absolute;top:-2px;left:0;right:0;text-align:center;background:#ff3b55;color:#fff;font-size:11px;font-weight:900;z-index:3}
@keyframes jmp{to{margin-bottom:12px}}
.pend{color:#ff5a6a;font-size:22px}
.linegrid button:disabled{opacity:.35;cursor:not-allowed;filter:grayscale(.6)}
.plate .av.emo{pointer-events:auto;cursor:pointer}
.plate .av.emo:hover{transform:scale(1.06)}
.plate .av.emo:active{transform:scale(.92)}
.pt{position:fixed;z-index:65;pointer-events:none;transform:translate(-50%,-50%);font-weight:900;text-shadow:0 0 6px rgba(255,255,255,.6);animation:ptf 1s cubic-bezier(.15,.7,.4,1) forwards}
@keyframes ptf{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}70%{opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy) + 60px)) scale(1) rotate(var(--rot));opacity:0}}
.chatbtn{position:absolute;left:14px;bottom:268px;z-index:16;width:48px;height:48px;border-radius:50%;border:3px solid #fff;background:#2a4a78;color:#fff;font-size:22px;cursor:pointer;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.chatmenu{position:absolute;left:14px;bottom:324px;z-index:30;display:flex;flex-direction:column;gap:6px;background:rgba(10,22,40,.92);border:1px solid var(--line);border-radius:12px;padding:8px;max-width:min(320px,calc(100vw - 28px))}
.chatmenu button{background:#1d3150;color:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-family:inherit;font-weight:700;font-size:14px;text-align:left;cursor:pointer}
.chatmenu button:hover{background:#2f4f80}
.cbub{position:fixed;z-index:62;transform:translate(-50%,-100%);background:#fff;color:#111;font-weight:900;font-size:15px;padding:8px 14px;border-radius:14px;border:3px solid var(--pc);
  max-width:220px;text-align:center;box-shadow:0 6px 16px rgba(0,0,0,.45);pointer-events:none;animation:cb 3.2s forwards}
.cbub::after{content:"";position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);border:8px solid transparent;border-top-color:var(--pc);border-bottom:0}
.cbub.below{transform:translate(-50%,0)}
.cbub.below::after{bottom:auto;top:-10px;border-top:0;border-bottom:8px solid var(--pc)}
@keyframes cb{0%{opacity:0;margin-top:8px}8%{opacity:1;margin-top:0}85%{opacity:1}100%{opacity:0}}
@media (max-width:760px){.chatbtn{bottom:236px;left:8px;width:42px;height:42px;font-size:18px}.chatmenu{bottom:284px;left:8px}.chatmenu button{font-size:13px;padding:6px 12px}}
.tmbtn{border:none;border-radius:999px;color:#fff;font-weight:900;font-size:11px;padding:2px 10px;margin-left:6px;cursor:pointer;font-family:inherit}
.tmbtn:disabled{cursor:default}
.plate .tmb{position:absolute;left:-14px;bottom:-6px;z-index:3;color:#fff;font-weight:900;font-size:11px;padding:1px 6px;border-radius:999px;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.plate.tm .av{outline:4px solid var(--tc);outline-offset:1px}
.seat.fin .av{filter:grayscale(.7) brightness(.7)}
.plate .finb{position:absolute;top:28%;left:50%;transform:translateX(-50%) rotate(-12deg);background:#fff;color:#111;font-weight:900;font-size:12px;padding:1px 8px;border-radius:6px;white-space:nowrap;z-index:4;box-shadow:0 2px 6px rgba(0,0,0,.5)}
.mates{position:absolute;left:12px;top:48px;z-index:19;max-width:min(560px,46vw);background:rgba(10,22,40,.85);border:2px solid var(--tc);border-radius:12px;padding:6px 8px;backdrop-filter:blur(4px)}
.mates .mh{font-size:12px;font-weight:900;margin:2px 0 4px;display:flex;align-items:center;gap:6px;cursor:pointer}
.mates .mrow{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:4px}
.mates.closed .mrow{display:none}
.mc{width:55px;height:80px;position:relative;flex:0 0 auto}
.mc .card{transform:scale(.5);transform-origin:top left;position:absolute;left:0;top:0;box-shadow:0 2px 4px rgba(0,0,0,.4)}
@media (max-width:760px){.mates{top:44px;left:8px;max-width:58vw}.mc{width:34px;height:50px}.mc .card{transform:scale(.405)}}
.hand .card.sel{transform:translateY(calc(var(--y,0px) - 34px)) rotate(var(--r,0)) scale(1.06)!important;box-shadow:0 0 0 4px #3ccf7a,0 10px 20px rgba(0,0,0,.5)!important;z-index:20!important}
.hand .card.comp{box-shadow:0 0 0 3px #3ccf7a,0 0 18px 3px rgba(60,207,122,.7)!important;filter:none!important;cursor:pointer}
.selno{position:absolute;right:4px;bottom:12px;width:24px;height:24px;border-radius:50%;background:#3ccf7a;color:#08311a;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.selbar{position:absolute;left:50%;bottom:258px;transform:translateX(-50%);z-index:25;display:flex;gap:8px;align-items:center;background:rgba(8,40,22,.92);border:2px solid #3ccf7a;border-radius:999px;padding:6px 8px 6px 16px;white-space:nowrap}
.selbar span{font-size:12px;color:#bff5d3}
@media (max-width:760px){.selbar{bottom:196px;max-width:94vw}.selbar span{display:none}}
.arena.many .plate .av{width:54px;height:54px;font-size:28px}
.arena.many .plate .nm{font-size:12px;max-width:110px}
.arena.many .plate .cnt{font-size:15px;height:28px;min-width:24px;right:-26px}
.arena.many .fan .bk{left:-16px;top:-23px;width:32px;height:46px;border-width:1.5px}
.arena.many .fan .bk::after{font-size:7px}
.arena.many2 .plate .av{width:46px;height:46px;font-size:24px}
@media (max-width:760px){.arena.many .plate .av{width:36px;height:36px;font-size:19px}.arena.many .plate .nm{font-size:9px;max-width:70px;padding:1px 10px 1px 4px}.arena.many .plate .cnt{font-size:11px;height:20px;min-width:18px;right:-18px}.arena.many .fan .bk{left:-10px;top:-14px;width:20px;height:28px}.arena.many .fan .bk::after{display:none}}
.tmr{position:absolute;left:50%;bottom:252px;transform:translateX(-50%);z-index:12;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.45);border-radius:999px;padding:3px 12px}
.tmr .tb{width:140px;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.tmr .tb i{display:block;height:100%;background:#9fb2cc;transition:width .2s linear}
.tmr.mine .tb i{background:#ffd34d}.tmr.low .tb i{background:#ff5a6a}
.tmr b{font-size:13px;min-width:20px;text-align:right}.tmr.low b{color:#ff5a6a}
@media (max-width:760px){.tmr{bottom:186px}.tmr .tb{width:90px}}
.plate .awayb{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:#555;color:#fff;font-size:10px;font-weight:900;padding:1px 6px;border-radius:999px;white-space:nowrap;z-index:4}
.recon{position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:90;background:#b8344a;color:#fff;font-weight:900;padding:8px 18px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.5);animation:kwp .8s ease-in-out infinite alternate}
.modal .inner.wide{max-width:min(1200px,96vw)}
.mapbox{height:72vh;overflow:auto;background:#fff;border-radius:10px;touch-action:pan-x pan-y pinch-zoom}
.mapbox img{display:block;width:100%;max-width:none;user-select:none}
.tutp{position:absolute;left:50%;top:48px;transform:translateX(-50%);z-index:26;width:min(540px,92vw);background:rgba(255,253,240,.97);color:#1a1a1a;border-radius:14px;border:3px solid #ffb020;box-shadow:0 10px 30px rgba(0,0,0,.5);padding:10px 14px}
.tutp.red{border-color:#ff5a6a}

#game{display:block;height:100vh;height:100dvh}
.arena{position:relative;width:100%;height:100%;overflow:hidden;

.arena::before{content:"";position:absolute;left:50%;top:43%;width:84%;height:74%;transform:translate(-50%,-50%);border-radius:50%;
  border:3px solid rgba(255,255,255,.08);box-shadow:inset 0 0 80px rgba(0,0,0,.35),0 0 0 14px rgba(255,255,255,.025)}
.arena::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.018) 46px 48px)}
.ring{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.ring ellipse{fill:none;stroke:rgba(255,211,77,.35);stroke-width:3;stroke-dasharray:4 14;stroke-linecap:round;animation:flow 1.2s linear infinite}
.ring.rev ellipse{animation-direction:reverse}
@keyframes flow{to{stroke-dashoffset:-18}}
.hud{position:absolute;left:12px;top:10px;z-index:20;display:flex;gap:6px;align-items:center}
.hud .title{font-weight:900;color:var(--accent);margin-right:6px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.btn.sm{padding:5px 10px;font-size:13px;background:rgba(0,0,0,.3)}
.info{position:absolute;right:12px;top:10px;z-index:20;width:280px;padding:8px 10px;background:rgba(10,22,40,.82);backdrop-filter:blur(4px)}

.center{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);z-index:5;display:flex;flex-direction:column;align-items:center;gap:6px}
.center .pile{gap:22px}
.center .deck{transform:rotate(-8deg)}
.center .dk{font-size:18px}
.cl{justify-content:center;max-width:320px}
.center .req{margin:0}
.seat{position:absolute;z-index:6;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.plate{position:relative;display:flex;flex-direction:column;align-items:center}
.plate .nm{background:linear-gradient(90deg,var(--pc),transparent);color:#fff;font-weight:900;font-size:14px;padding:2px 26px 2px 10px;border-radius:6px 0 0 6px;

.plate .av{width:72px;height:72px;border-radius:10px;border:3px solid #fff;background:linear-gradient(135deg,var(--pc),#1b2c47);

.actions{position:absolute;right:14px;bottom:200px;z-index:15;display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding:0}
.kwbtn{width:96px;height:96px;border-radius:50%;border:4px solid #fff;font-size:26px;cursor:pointer;

.kwbtn:disabled{filter:grayscale(.85) brightness(.6);cursor:not-allowed;animation:none}

.splash{position:fixed;left:50%;top:42%;z-index:70;pointer-events:none;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;animation:spl 1.8s forwards}
.splash::before{content:"";position:absolute;left:50%;top:50%;width:520px;height:520px;transform:translate(-50%,-50%);border-radius:50%;z-index:-1;

@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.splash .big{font-size:clamp(70px,16vw,150px);font-weight:900;color:#ffd21f;letter-spacing:.02em;line-height:1;

@keyframes spl{0%{transform:translate(-50%,-50%) scale(.3) rotate(-10deg);opacity:0}14%{transform:translate(-50%,-50%) scale(1.12) rotate(3deg);opacity:1}24%{transform:translate(-50%,-50%) scale(1) rotate(0)}82%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.15)}}

const DEPOTS = {TK:['腰が原','腰が原車両基地'],B:['原石町','千波車両基地'],SS:['佐雅野','佐雅野車庫'],ST:['金が山','金が山車両基地'],MK:['能見市','能見車両基地'],MI:['糸里港','糸里港車庫'],SK:['井川','井川検車区'],SM:['今城','今城車庫'],AR:['有田','有田車両基地'],KH:['茶屋桜町','茶屋桜町車庫'],KN:['北大神本町','北波検車区'],A:['唐林','唐林車両基地'],HH:['星影','星影工場'],S1:['雪峰湖','雪峰湖車両基地'],S2:['川島空港第1ターミナル','空港線車両基地'],S3:['梁居寺','梁居寺検車区'],S4:['鳶島新都心','鳶島車両基地'],S5:['江東町','江東車両基地'],Y:['羽竜','羽竜車両センター'],SR:['金城','城川車庫'],YG:['南夕霧','夕霧車庫'],AH:['高見浜','高見浜車庫'],KT:['竜蔵寺','辰巳検車区'],KK:['松森川','松森川車庫'],KO:['海王新地','海王新地車庫'],LR:['浮端町','倉竹LRT車庫'],OK:['弥芝勝川','沖津車両区'],MH:['宮浜港','宮浜港車庫'],U:['新野','新野車両センター']};

/* =========================================================
   デッキ構築
   ========================================================= */
function buildDeck(active=LINE_ORDER){
  const deck=[]; let n=0;
  const add=c=>{c.id='c'+(n++);deck.push(c)};
  for (const id of active){
    const L=LINES[id]; const ss=L.stations; const len=ss.length;
    // 特殊化する駅（決め打ち：通過待ち＝1/3地点、当駅止まり＝2/3地点）
    const skipIdx = len>=8 ? Math.floor(len/3) : -1;
    const revIdx  = len>=8 ? Math.floor(len*2/3) : -1;
    ss.forEach((s,i)=>{
      let type='normal'; if(i===skipIdx) type='skip'; else if(i===revIdx) type='rev';
      add({type,line:id,station:s.name,code:s.code});
    });
    // 長い路線は通過待ち・当駅止まりをもう1枚ずつ
    if(len>=20){
      const a=ss[Math.floor(len/6)], b=ss[Math.floor(len*5/6)];
      add({type:'skip',line:id,station:a.name,code:a.code,dup:1});
      add({type:'rev',line:id,station:b.name,code:b.code,dup:1});
    }
    const [near,dname]=DEPOTS[id];
    add({type:'depot',line:id,station:near,name:dname});
    if(len>=15) add({type:'depot',line:id,station:near,name:dname});
  }
  const nl=st=>STATION_LINES[st].filter(l=>active.includes(l)).length;
  const gs=shuffle(Object.keys(STATION_LINES).filter(st=>nl(st)>=2)).sort((a,b)=>nl(b)-nl(a));
  gs.slice(0,Math.max(3,Math.round(gs.length*0.35))).forEach(st=>add({type:'gate',station:st}));
  const nt=Math.max(4,Math.round(active.length*1.2));
  for (let i=0;i<nt;i++) add({type:'ticket'});
  return deck;
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* =========================================================
   ゲームエンジン（ホスト側で実行）
   ========================================================= */
class Engine{
  constructor(players,opts={}){
    this.active=opts.lines||LINE_ORDER.slice(); this.rules=opts.rules||{};
    this.players=players.map(p=>({...p,hand:[],declared:false}));
    this.deck=shuffle(buildDeck(this.active));
    this.discard=[]; this.dir=1; this.turn=Math.floor(Math.random()*this.players.length);
    this.gid=Math.random().toString(36).slice(2); this.turnStart=Date.now(); this.lastBy=null; this.requiredLine=null; this.drawn=null; this.vuln=null; this.winner=null; this.log=[]; this.seq=0; this.events=[];
    for(let r=0;r<7;r++) for(const p of this.players) p.hand.push(this.deck.pop());
    // 最初の場札は通常駅カード
    let i=this.deck.findIndex(c=>c.type==='normal');
    this.discard.push(this.deck.splice(i,1)[0]);
    this.addLog(`🚉 ${this.top.station}駅（${LINES[this.top.line].name}）から出発！`);
    this.addLog(`${this.players[this.turn].name} さんの番から`);
  }
  get top(){return this.discard[this.discard.length-1]}
  addLog(s){this.log.push(s); if(this.log.length>60) this.log.shift()}
  event(e){this.events.push({...e,k:++this.seq})}
  matchLines(){return this.requiredLine ? [this.requiredLine] : linesOf(this.top.station).filter(l=>this.active.includes(l))}
  next(k=1){ const n=this.players.length; let i=this.turn, c=0, g=0;
    while(c<k && g<n*4){ i=((i+this.dir)%n+n)%n; g++; if(!this.players[i].finished) c++; }
    return i; }
  activeIdx(){ return this.players.map((q,i)=>i).filter(i=>!this.players[i].finished); }
  isMate(a,b){ return !!this.rules.team && a!==b && this.players[a]?.team===this.players[b]?.team; }
  // 手札がなくなったとき。trueならゲーム終了
  onEmpty(pi){
    const p=this.players[pi];
    if(!this.rules.team){ this.winner=pi; this.addLog(`🏆 ${p.name} さんが上がり！ 終点到着！`); this.event({type:'win',who:p.name}); return true; }
    p.finished=true; p.declared=false; if(this.vuln===pi) this.vuln=null;
    if(this.players.filter(q=>q.team===p.team).every(q=>q.finished)){
      this.winner=pi; this.winTeam=p.team; this.addLog(`🏆 ${p.name} さんが上がり！ ${TEAM[p.team].name}チーム全員到着で勝利！`); this.event({type:'win',who:p.name}); return true;
    }
    this.addLog(`🏁 ${p.name} さんが上がり！ 残りの味方を応援しよう`); this.event({type:'finish',who:pi}); return false;
  }
  drawCards(p,k){
    const got=[];
    for(let i=0;i<k;i++){
      if(!this.deck.length) this.refill();
      if(!this.deck.length) break;
      const c=this.deck.pop(); p.hand.push(c); got.push(c);
    }
    if(p.hand.length>1){ p.declared=false; if(this.vuln===this.players.indexOf(p)) this.vuln=null; }
    if(got.length) this.event({type:'draw',who:this.players.indexOf(p),n:got.length});
    return got;
  }
  // 1枚単独で出せるか
  canPlay(pi,card){
    const p=this.players[pi]; const m=this.matchLines();
    if(this.pending>0) return card.type==='depot';
    if(card.type==='ticket') return p.hand.length>1 && !p.declared;
    if(card.type==='gate') return this.gatePairs(pi,card).length>0 || (!this.requiredLine && this.top.station===card.station);
    if(m.includes(card.line)) return true;
    if(this.requiredLine) return false;
    if(card.type==='depot' && this.top.type==='depot') return true; // 車両基地は路線が違っても重ねられる
    const R=this.rules||{};
    if(R.company && m.some(l=>LINES[l].co===LINES[card.line].co)) return true;
    if(R.digit && card.type!=='depot' && this.top.type!=='depot' && numDigit(card.code)!=null && numDigit(card.code)===numDigit(this.top.code)) return true;
    return false;
  }
  gatePairs(pi,gate){
    const p=this.players[pi]; const m=this.matchLines();
    if(!linesOf(gate.station).some(l=>m.includes(l))) return [];
    return p.hand.filter(c=>c.id!==gate.id && c.station===gate.station && c.line);
  }
  jumpIds(pi){
    if(this.winner!=null || pi===this.turn || this.pending>0 || !this.top.station) return [];
    return this.players[pi].hand.filter(c=>c.type==='gate' && c.station===this.top.station).map(c=>c.id);
  }
  lineCount(l){ let n=this.deck.filter(c=>c.line===l).length; for(const p of this.players) n+=p.hand.filter(c=>c.line===l).length; return n; }
  lineAvail(){ const o={}; for(const l of this.active) o[l]=this.lineCount(l); return o; }
  ticketOk(l){ const av=this.lineAvail(); if(!(l in av)) return false; return av[l]>3 || !Object.values(av).some(n=>n>3); }
  refill(){
    if(this.deck.length || this.winner!=null) return;
    if(!this.rules.infinite){
      this.winner=-1; this.drawn=null; this.pending=0;
      this.addLog('🚧 山札がなくなりました。引き分けです'); this.event({type:'drawgame'}); return;
    }
    if(this.discard.length>1){
      const top=this.discard.pop(); this.deck=shuffle(this.discard); this.discard=[top];
      this.addLog('🔄 山札が切れたので、場のカードを切り直して山札にしました'); this.event({type:'refill'});
    }
  }
  act(pi,a){ const r=this._act(pi,a); this.refill(); return r; }
  multiOk(pi,first){ // 一緒に出せるカード
    const p=this.players[pi]; if(this.drawn||!first) return [];
    if(first.type==='depot') return p.hand.filter(c=>c.id!==first.id && c.type==='depot');
    if(['normal','skip','rev'].includes(first.type)) return p.hand.filter(c=>c.id!==first.id && c.line===first.line && ['normal','skip','rev','depot'].includes(c.type));
    return [];
  }
  timeLeft(){ return (this.rules.timer && this.winner==null) ? Math.max(0,TURN_MS-(Date.now()-this.turnStart)) : null; }
  timeoutAct(){
    const pi=this.turn, p=this.players[pi]; if(!p||p.cpu||this.winner!=null) return false;
    this.addLog(`⏱ ${p.name} さんは時間切れ（自動で山札から引いてパス）`); this.event({type:'timeout',who:pi});
    if(this.pending>0 || !this.drawn) this._act(pi,{type:'draw'});
    if(this.winner==null && this.turn===pi && this.drawn) this._act(pi,{type:'pass'});
    this.refill(); return true;
  }
  canDeclare(pi){
    const p=this.players[pi]; if(!p||this.winner!=null||p.declared) return false;
    if(p.hand.length===1) return true; // 言い忘れの後でも指摘される前なら宣言できる

  removePlayer(pi){

  playableIds(pi){

  _act(pi,a){

    const p=this.players[pi];
    if(a.type==='catch'){
      if(this.vuln==null || this.vuln===pi) return '指摘できません';
      if(this.isMate(pi,this.vuln)) return '味方は指摘できません';
      const v=this.players[this.vuln];
      if(v.hand.length!==1 || v.declared){this.vuln=null;return '指摘できません'}
      this.drawCards(v,2); this.addLog(`🚨 ${p.name} さんが指摘！ ${v.name} さんはANO!宣言忘れで2枚追加`);
      this.event({type:'catch',who:v.name,by:p.name}); this.vuln=null; return null;
    }

    }

      this.event({type:'emote',who:pi}); return null;
    }
    if(a.type==='jump'){
      const card=p.hand.find(c=>c.id===a.id);
      if(!card || !this.jumpIds(pi).includes(card.id)) return 'ジャンプインできません';
      if(this.vuln===pi) this.vuln=null;
      p.hand=p.hand.filter(c=>c!==card); this.discard.push(card); this.drawn=null; this.requiredLine=null;
      this.lastBy=pi; this.event({type:'play',who:pi,cards:[{...card}],jump:true});

      if(p.hand.length===0 && this.onEmpty(pi)) return null;
      if(p.hand.length===1){ if(!p.declared){ this.vuln=pi; this.vulnSeq=(this.vulnSeq||0)+1; } } else p.declared=false;

      }
      const [c]=this.drawCards(p,1);
      this.addLog(`${p.name} さんが山札から1枚引きました`);

    }

      if(!this.drawn) return 'まず山札から引いてください';
      this.addLog(`${p.name} さんはパス`); this.endTurn(1); return null;
    }
    if(a.type==='play'){
      const card=p.hand.find(c=>c.id===a.id); if(!card) return 'カードがありません';

      if(card.type==='gate'){
        const pairs=this.gatePairs(pi,card); const pair=pairs.find(c=>c.id===a.pair)||pairs[0];
        if(pair){ played.push(pair); topCard=pair; }
      }
      p.hand=p.hand.filter(c=>!played.includes(c));
      for(const c of played) this.discard.push(c);
      this.lastBy=pi; this.event({type:'play',who:pi,cards:played.map(c=>({...c})),line:a.line||null});
      this.drawn=null;
      // ログ
      if(extra.length) this.addLog(`✨ ${p.name}：${played.length}枚まとめ出し！ ${played.map(c=>c.type==='depot'?`${LINES[c.line].name}+2`:`${c.station}`).join('・')}`);
      else if(card.type==='gate' && played.length===1) this.addLog(`🟧 ${p.name}：${card.station}駅の改札を通過`);
      else if(card.type==='gate') this.addLog(`🟧 ${p.name}：改札で乗り換え！ ${card.station}駅（${LINES[topCard.line].name}）へ 2枚出し`);
      else if(card.type==='ticket') this.addLog(`🎫 ${p.name}：乗車券！ 次は「${LINES[a.line].name}」を指定`);
      else if(card.type==='depot') this.addLog(`🏭 ${p.name}：${card.name}（${LINES[card.line].name}）+2`);
      else this.addLog(`${p.name}：${LINES[card.line].name} ${card.station}${card.type==='skip'?'【通過待ち】':card.type==='rev'?'【当駅止まり】':''}`);

          this.addLog('🔄 末尾0！ 全員が時計回りに手札を交換'); this.event({type:'swap',kind:0});
        } else {
          let t=+a.target; if(!(t>=0&&t<n0&&t!==pi&&!this.players[t].finished)) t=act.filter(i=>i!==pi).sort((x,y)=>this.players[x].hand.length-this.players[y].hand.length)[0];

        this.addLog(`🏭 +${this.pending}！ ${nx.name} さんは車両基地を重ねるか ${this.pending} 枚引く`);
      }
      this.endTurn(1+sk);

    }
    return '不明な操作';
  }
  endTurn(k){
    this.drawn=null; this.turn=this.next(k); this.turnStart=Date.now();

  // 乗車券の指定から誰も出せないまま2周したら、山札からその路線のカードを出す
  autoTicket(){

    this.addLog(`🎫 乗車券の指定から誰も出せないまま2周… 山札から「${LINES[c.line].name} ${c.station}」を場に出しました`);

  view(pi){

      phase:'play', gid:this.gid, lastBy:this.lastBy, me:pi, turn:this.turn, dir:this.dir, winner:this.winner,

      timeLeft:this.timeLeft(), playable:this.playableIds(pi), jumpable:this.jumpIds(pi), pending:this.pending||0, lineAvail:this.lineAvail(), canDeclare:this.canDeclare(pi), vuln:this.vuln, active:this.active, rules:this.rules, deckCount:this.deck.length, log:this.log.slice(-30), events:this.events.slice(-10)

  // ---- CPU ----
  cpuDecide(pi){
    const p=this.players[pi];
    const ids=this.playableIds(pi);
    if(p.hand.length>1 && this.canDeclare(pi) && Math.random()<0.85) return {type:'declare'};
    if(!ids.length) return this.drawn ? {type:'pass'} : {type:'draw'};
    const cards=p.hand.filter(c=>ids.includes(c.id));
    const nx=this.next(1); const nextCount=this.isMate(pi,nx)?99:this.players[nx].hand.length;
    const score=c=>{
      let s=Math.random();
      if(c.type==='gate') s+=6;
      if(c.type==='depot'||c.type==='skip') s+= nextCount<=2?8:2;
      if(c.type==='rev') s+=1.5;
      if(c.type==='ticket') s-= (cards.length>1?5:0);

        if(d==='0') s+= this.players[(pi-1+this.players.length)%this.players.length].hand.length < p.hand.length-1 ? 3 : -2; }
      return s;
    };
    cards.sort((a,b)=>score(b)-score(a));
    const c=cards[0];
    if(c.type==='ticket'){
      const cnt={}; for(const h of p.hand) if(h.line) cnt[h.line]=(cnt[h.line]||0)+1;
      const okL=this.active.filter(l=>this.ticketOk(l));
      let best=Object.keys(cnt).filter(l=>okL.includes(l)).sort((a,b)=>cnt[b]-cnt[a])[0] || okL[Math.floor(Math.random()*okL.length)];
      return {type:'play',id:c.id,line:best};
    }
    const tgt=()=>{ const c=this.activeIdx().filter(i=>i!==pi); const o=c.filter(i=>!this.isMate(pi,i)); return (o.length?o:c).sort((x,y)=>this.players[x].hand.length-this.players[y].hand.length)[0]; };
    if(c.type==='gate'){ const pr=this.gatePairs(pi,c); return {type:'play',id:c.id,pair:pr[0]?.id,target:tgt()}; }
    let more=this.multiOk(pi,c);
    if(more.length && Math.random()<0.85){
      if(p.declared && p.hand.length-1-more.length!==0) more=more.slice(0,Math.max(0,p.hand.length-2)); // 宣言済みなら残り1枚に合わせる
      return {type:'play',id:c.id,more:shuffle(more.slice()).map(x=>x.id),target:tgt()};
    }
    return {type:'play',id:c.id,target:tgt()};
  }
}

// ---- ホスト ----
function hostRoom(){
  if(typeof Peer==='undefined'){ $('titleErr').textContent='通信ライブラリを読み込めませんでした'; return; }
  S.role='host'; S.myName=myNameVal(); S.code=genCode();
  S.roster=[{name:S.myName,icon:S.icon,cpu:false,peer:'host'}];
  $('titleErr').textContent='部屋を作成中…';
  S.peer=new Peer(PREFIX+S.code);
  S.peer.on('open',()=>{ $('titleErr').textContent=''; show('lobby'); renderLobby(); });
  S.peer.on('disconnected',()=>{ try{S.peer.reconnect()}catch(e){} });
  S.peer.on('error',e=>{ if(e.type==='unavailable-id'){S.peer.destroy();hostRoom();return} $('titleErr').textContent='通信エラー: '+e.type; });
  S.peer.on('connection',conn=>{
    conn.on('data',d=>onHostData(conn,d));
    conn.on('close',()=>onGuestLeft(conn.peer));
  });
}
function onHostData(conn,d){
  if(d.t==='join'){
    const tok=String(d.token||'').slice(0,40);
    if(S.engine){
      const pi=tok?S.engine.players.findIndex(p=>p.token===tok):-1;
      if(pi>=0){ // 再接続
        const p=S.engine.players[pi]; const old=p.peer;
        if(old && old!==conn.peer && S.conns[old]){ const oc=S.conns[old]; delete S.conns[old]; try{oc.close()}catch(e){} }
        p.peer=conn.peer; S.conns[conn.peer]=conn; const wasAway=p.away; p.cpu=false; p.away=false;
        if(wasAway){ S.engine.addLog(`📡 ${p.name} さんが再接続しました`); S.engine.event({type:'rejoin',who:pi}); }
        syncAll(); return;
      }
      conn.send({t:'err',m:'ゲームはすでに開始しています'}); setTimeout(()=>conn.close(),500); return;
    }
    const ri=tok?S.roster.findIndex(r=>r.token===tok):-1;
    if(ri>=0){ const r=S.roster[ri]; if(r.peer&&r.peer!==conn.peer&&S.conns[r.peer]){ const oc=S.conns[r.peer]; delete S.conns[r.peer]; try{oc.close()}catch(e){} } r.peer=conn.peer; r.cpu=false; S.conns[conn.peer]=conn; broadcastLobby(); return; }
    if(S.roster.length>=MAXP){ conn.send({t:'err',m:'満員です'}); setTimeout(()=>conn.close(),500); return; }
    S.conns[conn.peer]=conn;
    S.roster.push({name:String(d.name).slice(0,10),icon:sanIcon(d.icon),cpu:false,peer:conn.peer,token:tok}); teamFix();
    broadcastLobby();
  } else if(d.t==='act'){
    if(!S.engine) return;
    const pi=S.engine.players.findIndex(p=>p.peer===conn.peer);
    if(pi<0) return;
    const err=S.engine.act(pi,d.a);
    if(err) conn.send({t:'err',m:err});
    syncAll();
  } else if(d.t==='restart'){}
}
function sanIcon(ic){ ic=String(ic||''); if(ic.startsWith('data:image/')&&ic.length<40000) return ic; return ic.length<=8?ic:'🚃'; }
function onGuestLeft(peerId){
  delete S.conns[peerId];
  if(!S.engine){ S.roster=S.roster.filter(r=>r.peer!==peerId); broadcastLobby(); return; }
  const p=S.engine.players.find(p=>p.peer===peerId);
  if(p && !p.away){ p.cpu=true; p.away=true; S.engine.addLog(`📡 ${p.name} さんの通信が切れました。再接続までCPUが代わりに運転します`); syncAll(); }
}
function kickConn(peerId){ const c=S.conns[peerId]; delete S.conns[peerId]; if(c){ try{ c.send({t:'kicked'}); }catch(e){} setTimeout(()=>{ try{c.close()}catch(e){} },400); } }
function hostKick(pi){
  const E=S.engine; if(!E) return; const p=E.players[pi]; if(!p||p.peer==='host') return;
  if(!confirm(`${p.name} さんを退出させますか？`)) return;
  E.removePlayer(pi);
  if(p.peer && p.peer!=='host') kickConn(p.peer);
  syncAll();
}
function broadcastLobby(){
  const lv={phase:'lobby',roster:S.roster.map(r=>({name:r.name,cpu:r.cpu,icon:r.icon,team:r.team})),code:S.code,settings:S.settings};
  for(const c of Object.values(S.conns)){ try{ c.send({t:'view',v:lv}); }catch(e){} }
  renderLobby();
}
function teamFix(){ // チーム未設定のメンバーを少ない方へ
  for(const r of S.roster) if(r.team!==0&&r.team!==1){ const c0=S.roster.filter(x=>x.team===0).length, c1=S.roster.filter(x=>x.team===1).length; r.team=c0<=c1?0:1; }
}
function startGame(){
  if(S.roster.length<2){ alert('2人以上必要です（CPUを追加できます）'); return; }
  if(S.settings.rules.team){
    teamFix();
    const A=S.roster.filter(r=>r.team===0), B=S.roster.filter(r=>r.team===1);
    if(!A.length||!B.length){ alert('チーム戦は赤・青それぞれ1人以上必要です'); return; }
    const o=[]; for(let i=0;i<Math.max(A.length,B.length);i++){ if(A[i]) o.push(A[i]); if(B[i]) o.push(B[i]); } // 敵味方交互に座る
    S.roster=o;
  }
  S.engine=new Engine(S.roster,{lines:S.settings.lines,rules:{...S.settings.rules}});
  S.lastEventK=0;
  show('game'); syncAll();
}
function syncAll(){
  const E=S.engine; if(!E) return;
  E.players.forEach((p,i)=>{
    if(p.peer && p.peer!=='host' && !p.cpu){ const c=S.conns[p.peer]; c && c.open && c.send({t:'view',v:E.view(i)}); }
  });
  const hi=E.players.findIndex(p=>p.peer==='host');
  render(E.view(hi));
  scheduleCpu();
}
setInterval(()=>{ // ホスト側：時間切れチェック
  const E=S.engine; if(!E||S.role==='guest'||S.tut) return;
  if(E.rules.timer && E.winner==null && !E.players[E.turn]?.cpu && Date.now()-E.turnStart>TURN_MS){ if(E.timeoutAct()) syncAll(); }
},500);
setInterval(()=>{ // 画面側：残り時間表示
  const v=S.view, el=$('tmr'); if(!el) return;
  if(!v||v.timeLeft==null||v.winner!=null||v.players[v.turn]?.cpu){ el.classList.add('hidden'); return; }
  const left=Math.max(0,S.deadline-performance.now()); const sec=Math.ceil(left/1000);
  el.classList.remove('hidden'); el.classList.toggle('mine',v.turn===v.me); el.classList.toggle('low',sec<=10);
  $('tmrBar').style.width=(left/TURN_MS*100)+'%'; $('tmrNum').textContent=sec;
  if(v.turn===v.me && sec<=5 && sec>0 && S.lastTickSec!==sec){ S.lastTickSec=sec; SFX.play('tick'); }
},200);
function scheduleCpu(){
  const E=S.engine; if(!E||E.winner!=null||S.tut) return;
  // CPUによる指摘
  if(E.vuln!=null && !S.catchTimer && S.catchRolled!==E.vulnSeq){
    S.catchRolled=E.vulnSeq;
    const v=E.vuln;
    if(E.players[v].cpu && Math.random()<0.5) setTimeout(()=>{ if(E.vuln===v && E.canDeclare(v)){ E.act(v,{type:'declare'}); syncAll(); } },1800+Math.random()*2500);
    const catchers=E.players.map((p,i)=>i).filter(i=>i!==v && E.players[i].cpu && !E.isMate(i,v));
    if(catchers.length && Math.random()<0.6){
      S.catchTimer=setTimeout(()=>{S.catchTimer=null; if(E.vuln===v){E.act(catchers[Math.floor(Math.random()*catchers.length)],{type:'catch'}); syncAll();}},2200+Math.random()*2500);
    }
  }
  // CPUのジャンプイン
  if(!S.jumpTimer && S.jumpRolled!==E.top.id){
    const js=E.players.map((p,i)=>i).filter(i=>E.players[i].cpu && E.jumpIds(i).length);
    if(js.length){ S.jumpRolled=E.top.id; if(Math.random()<0.75){ const j=js[Math.floor(Math.random()*js.length)]; const topId=E.top.id;
      S.jumpTimer=setTimeout(()=>{ S.jumpTimer=null; if(E!==S.engine||E.top.id!==topId) return; const ids=E.jumpIds(j); if(!ids.length) return;
        if(E.players[j].hand.length===2 && Math.random()<0.85) E.act(j,{type:'declare'});
        E.act(j,{type:'jump',id:ids[0]}); syncAll(); },900+Math.random()*1200); } }
  }
  const cur=E.players[E.turn];
  if(cur.cpu && !S.cpuTimer){
    S.cpuTimer=setTimeout(()=>{
      S.cpuTimer=null; if(E!==S.engine||E.winner!=null) return;
      const t=E.turn; if(!E.players[t].cpu) return;
      const a=E.cpuDecide(t); E.act(t,a); syncAll();
    }, 1300+Math.random()*500);
  }
}

function rejoinInfo(){ try{ const r=JSON.parse(localStorage.getItem('kwsm_rejoin')||'null'); if(r&&Date.now()-r.t<3*3600*1000) return r; }catch(e){} return null; }
function tokenFor(code){ let r=rejoinInfo(); const tok=(r&&r.code===code)?r.token:Math.random().toString(36).slice(2)+Date.now().toString(36);
  try{ localStorage.setItem('kwsm_rejoin',JSON.stringify({code,token:tok,t:Date.now()})); }catch(e){} return tok; }
function joinRoom(codeArg){
  if(typeof Peer==='undefined'){ $('titleErr').textContent='通信ライブラリを読み込めませんでした'; return; }
  const code=(typeof codeArg==='string'?codeArg:$('codeInput').value).trim().toUpperCase();
  if(code.length!==5){ $('titleErr').textContent='5文字の部屋コードを入力してください'; return; }
  S.role='guest'; S.myName=myNameVal(); S.code=code; S.token=tokenFor(code);
  $('titleErr').textContent='接続中…';
  newGuestPeer();
}
function newGuestPeer(){
  S.peer=new Peer();
  S.peer.on('open',()=>guestConnect());
  S.peer.on('disconnected',()=>{ try{ if(!S.peer.destroyed) S.peer.reconnect(); }catch(e){} });
  S.peer.on('error',e=>{ if(S.reconnecting) return; $('titleErr').textContent= e.type==='peer-unavailable' ? '部屋が見つかりません' : '通信エラー: '+e.type; });
}
function guestConnect(){
  const conn=S.peer.connect(PREFIX+S.code,{reliable:true}); S.hostConn=conn;
  const to=setTimeout(()=>{ if(conn.open) return; if(S.reconnecting){ try{conn.close()}catch(e){} retryLater(); } else $('titleErr').textContent='部屋が見つかりません'; },8000);
  conn.on('open',()=>{ clearTimeout(to); $('titleErr').textContent=''; conn.send({t:'join',name:S.myName,icon:S.icon,token:S.token}); });
  conn.on('data',d=>{
    if(conn!==S.hostConn) return;
    if(d.t==='view' && S.reconnecting){ S.reconnecting=false; $('recon')?.remove(); toastErr('📡 再接続しました'); }
    if(d.t==='view'){ try{ localStorage.setItem('kwsm_rejoin',JSON.stringify({code:S.code,token:S.token,t:Date.now()})); }catch(e){}
      if(d.v.phase==='lobby'){ S.lobbyView=d.v; if(S.view){ S.view=null; closeModal(); } show('lobby'); renderLobby(); } else { show('game'); render(d.v); } }
    else if(d.t==='kicked'){ S.kicked=true; try{localStorage.removeItem('kwsm_rejoin')}catch(e){} alert('ホストによって退出させられました'); location.href=location.pathname; }
    else if(d.t==='err'){ toastErr(d.m); if(!S.view) $('titleErr').textContent=d.m; }
  });
  conn.on('close',()=>{ if(S.kicked || conn!==S.hostConn) return; if(!S.view && !S.lobbyView && !S.reconnecting){ $('titleErr').textContent='接続が切れました'; return; } startReconnect(); });
}
function startReconnect(){
  if(S.reconnecting) return; S.reconnecting=true; S.recStart=Date.now();
  const d=document.createElement('div'); d.id='recon'; d.className='recon'; d.textContent='📡 再接続中…（その間はCPUが代わりに操作します）'; document.body.appendChild(d);
  retryLater();
}
function retryLater(){
  if(!S.reconnecting) return;
  if(Date.now()-S.recStart>120000){ alert('ホストに再接続できませんでした'); location.href=location.pathname; return; }
  setTimeout(()=>{ if(!S.reconnecting) return;
    try{ if(!S.peer || S.peer.destroyed){ newGuestPeer(); return; } if(S.peer.disconnected){ S.peer.reconnect(); setTimeout(guestConnect,1200); return; } }catch(e){ newGuestPeer(); return; }
    guestConnect(); },2500);
}

function startTutorial(){
  S.role='solo'; S.myName=myNameVal();
  S.roster=[{name:S.myName,icon:S.icon,cpu:false,peer:'host'},{name:'CPU しまはま',cpu:true},{name:'CPU さがわ',cpu:true}];
  S.engine=new Engine(S.roster,{lines:PRESETS[0].lines,rules:{digit:false,swap:false,company:false,timer:false,infinite:true}});
  S.tut={i:0,phase:'play'}; S.lastEventK=0; show('game');
  if(!$('tutPanel')){ const d=document.createElement('div'); d.id='tutPanel'; d.className='tutp'; $('arena').appendChild(d); }
  tutSetup();
}
function tutSetup(){
  const E=S.engine, st=TUT[S.tut.i]; const cfg=st.setup(E);
  for(const q of E.players){ q.declared=false; q.finished=false; if(q.hand.length<5) q.hand.push(...E.deck.splice(0,5-q.hand.length)); }
  E.dir=1; E.turn=0; E.pending=0; E.drawn=null; E.requiredLine=null; E.vuln=null; E.lastBy=null; E.winner=null;
  E.discard.push(cfg.top); E.players[0].hand=cfg.hand; E.players[0].declared=!!cfg.declared;
  if(cfg.pre) cfg.pre();
  S.tut.mark=E.seq; S.tut.phase='play'; S.tut.x2=false;
  tutPanel(st.x,false); syncAll();
}
function tutPanel(html,next,red){

  el.innerHTML=`<div class="th">📘 チュートリアル ${S.tut.i+1}/${TUT.length}：${st.t}<button class="tx" id="tutQuit">やめる</button></div><div class="tb">${html}</div>${next?`<div class="tn"><button class="btn primary" id="tutNext">${next}</button></div>`:''}`;
  $('tutQuit').onclick=()=>{ if(confirm('チュートリアルをやめてタイトルに戻りますか？')) location.href=location.pathname; };

function tutAfterRender(v){
  const E=S.engine, st=TUT[S.tut.i]; if(!st) return;
  document.querySelectorAll('.tutGlow').forEach(e=>e.classList.remove('tutGlow'));
  if(S.tut.phase==='play'){
    const ev=E.events.filter(x=>x.k>S.tut.mark);
    if(st.x2 && !S.tut.x2 && E.players[0].declared){ S.tut.x2=true; tutPanel(st.x2,false); }
    if(st.miss && st.miss(ev,E)){ S.tut.phase='retry'; setTimeout(()=>{ if(E.vuln===0){ E.act(1,{type:'catch'}); syncAll(); } },700);
      tutPanel('あっ、ANO! を宣言しないで残り1枚になったので、CPUに <b>指摘されて2枚追加</b>…<br>もう一度やってみよう！','もう一度',true); return; }
    if(st.retry && st.retry(ev,E)){ S.tut.phase='retry'; tutPanel('おっと、今回はちがう出し方になったみたい。もう一度やってみよう！','もう一度',true); return; }
    if(st.done(ev,E)){
      S.tut.phase='ok'; if(st.after) st.after(E);
      if(S.tut.i===TUT.length-1){ setTimeout(tutComplete,1600); return; }
      setTimeout(()=>{ if(S.tut&&S.tut.phase==='ok') tutPanel('✅ '+st.ok,'次へ ▶'); },1100); return;
    }
    const g=(S.tut.x2&&st.glow2)||st.glow; if(g) document.querySelectorAll(g).forEach(e=>e.classList.add('tutGlow'));
  }
}

const PCOL=['#ffb020','#4fb3ff','#3ccf7a','#ff6b8a','#b38cff','#4fe0d0','#ff8a3d','#c6e84a','#f06ad8','#9fb2ff'];

function renderSeats(v){
  const ar=$('arena'); const W=ar.clientWidth, H=ar.clientHeight; const n=v.players.length;
  const cx=W/2, cy=H*0.43, rx=W*0.43, ry=H*0.36;
  const mob=W<760;
  let html='';
  v.players.forEach((p,i)=>{
    const sIdx=((i-v.me)%n+n)%n;
    const tmc=v.teamMode&&p.team!=null?TEAM[p.team]:null;
    const plate=`<div class="plate ${tmc?'tm':''}" style="--pc:${pcol(i)};--tc:${tmc?tmc.color:'transparent'}">${tmc?`<div class="tmb" style="background:${tmc.color}">${tmc.name}${v.players[v.me].team===p.team&&i!==v.me?'・味方':''}</div>`:''}${p.finished?'<div class="finb">🏁 上がり</div>':''}${p.away?'<div class="awayb">📡 再接続待ち・CPU代行</div>':''}<div class="nm">${esc(p.name)}</div><div class="av">${iconHTML(p.icon,p.cpu?'🤖':AVA[i%AVA.length])}</div>${S.role==='host'&&i!==v.me?`<button class="kick" data-kick="${i}" title="退出させる">✕</button>`:''}<div class="cnt">${p.count}</div>${p.count===1&&p.declared?'<div class="anob">ANO!</div>':''}</div>`;
    if(sIdx===0){ html+=`<div class="seat mine ${i===v.turn?'turn':''} ${p.finished?'fin':''}" id="seat${i}">${plate}</div>`; return; }
    const span=n>6?250:Math.min(210,120*(n-2)); const opp=n-1;
    const ang=(opp===1?270:165+ (210-span)/2 + (sIdx-1)*span/(opp-1))*Math.PI/180;
    const sx=cx+rx*Math.cos(ang), sy=cy+ry*Math.sin(ang)*(Math.sin(ang)<0?1:0.9);
    const fk=mob?(Math.abs(Math.cos(ang))>0.5?0.76:0.62):0.66; const fx=cx+rx*fk*Math.cos(ang), fy=cy+ry*fk*Math.sin(ang);
    const rot=ang*180/Math.PI-90+180;
    const k=Math.min(p.count,n>6?9:14), step=Math.min(n>6?7:9,(n>6?50:80)/Math.max(k,1));
    let fan=''; for(let j=0;j<k;j++) fan+=`<div class="bk" style="transform:rotate(${(j-(k-1)/2)*step}deg)"></div>`;
    html+=`<div class="seat ${i===v.turn?'turn':''} ${p.finished?'fin':''}" id="seat${i}" style="left:${Math.min(W-(mob?66:80),Math.max(mob?44:70,sx))}px;top:${Math.max(mob?70:62,sy-(mob&&Math.abs(Math.cos(ang))>0.5?80:0))}px">${plate}</div>`
        + `<div class="fan" id="fan${i}" style="left:${fx}px;top:${fy}px;transform:rotate(${rot}deg)">${fan}</div>`;
  });
  $('seats').innerHTML=html; $('arena').classList.toggle('many',n>6); $('arena').classList.toggle('many2',n>8);
  { const myAv=document.querySelector(`#seat${v.me} .av`); if(myAv){ const can=v.turn!==v.me || v.winner!=null; myAv.classList.toggle('emo',can); myAv.title=can?'クリックでパーティクル！':'';
    myAv.onclick=()=>{ const vv=S.view; if(!vv) return; if(vv.turn===vv.me && vv.winner==null) return; const t=Date.now(); if(t-(S.lastEmo||0)<250) return; S.lastEmo=t; send({type:'emote'}); }; } }
  $('seats').querySelectorAll('[data-kick]').forEach(b=>b.onclick=()=>hostKick(+b.dataset.kick));
  // fanをseat内参照できるように
  v.players.forEach((p,i)=>{ const f=$('fan'+i), st=$('seat'+i); if(f&&st){ st.appendChild(f.cloneNode(true)); f.remove(); const nf=st.querySelector('.fan'); const l=parseFloat(nf.style.left)-parseFloat(st.style.left), t=parseFloat(nf.style.top)-parseFloat(st.style.top); nf.style.left=(l+st.offsetWidth/2)+'px'; nf.style.top=(t+st.offsetHeight/2)+'px'; } });
  const rg=document.querySelector('.ring'); rg.classList.toggle('rev',v.dir!==1);
}

function layoutHand(){

  <p>場に出ている<b>駅に乗り入れている路線</b>のカードを1枚出します。出せない場合は山札から1枚引きます（引いたカードが出せればそのまま出せます）。手札が残り1枚になるときは「ANO!」と宣言。先に手札がなくなった人の勝ち！</p>
  <h3>🔢 追加ルール（設定で切替）</h3><p><b>駅ナンバー一致：</b>駅ナンバーの末尾の数字が同じカードも出せます（例：T06日築城 の上に B16井川湯元）。UNOの数字合わせにあたります。<br><b>同じ会社：</b>同じ鉄道会社の路線のカードも出せます。</p>
  <h3>🚉 駅カード</h3><p>路線の色と駅名が書かれた基本カード。たとえば場が「川島駅」なら、島浜線・千波線・佐川本線・大神湖線・地下鉄中央線・空港線のカードが出せます。</p>
  <h3>✨ まとめ出し</h3><p>出せるカードを押すと選択状態になり、一緒に出せるカードが緑に光ります。<b>同じ路線のカード</b>（駅カード・車両基地）や、<b>車両基地どうし</b>（路線は問わない）は何枚でもまとめて出せます。押した順に出て、最後に選んだカードが場札になります。通過待ち・当駅止まり・+2の効果は枚数分すべて発動します（例：+2を2枚で+4）。</p>
  <h3>⏭ 通過待ち</h3><p>次の人を飛ばして、2つ先の人の番になります（スキップ）。</p>
  <h3>🔁 当駅止まり</h3><p>ターンの順番が逆回りになります（リバース）。2人対戦では通過待ちと同じ効果。</p>
  <h3>🟧 改札（オレンジ）</h3><p><b>⚡ジャンプイン：</b>場に改札と同じ駅が出たら、自分の番でなくても改札カード1枚をすぐ出せます。出した人の次の人から順番が続きます（車両基地の+が溜まっている間は不可）。自分の番なら、場と同じ駅の改札は1枚だけでも出せます。<br>改札と同じ駅名のカードを持っているとき、その2枚をまとめて出せます。場の駅とその改札の駅が同じ路線でつながっていれば出せ、一緒に出した駅カードが新しい場札になります。</p>
  <h3>🏭 車両基地（+2）</h3><p>次の人は山札から2枚引き、その番は休みです。ただし車両基地を持っていれば<b>路線が違っても</b>重ねて出せ、+2ずつ溜まって次の人へ回ります。場のいちばん上が車両基地なら、+を引き終わったあとでも別路線の車両基地を出せます。</p>
  <h3>🎫 乗車券</h3><p>路線に関係なくいつでも出せます。出した人は路線を1つ選び、次の人はその路線のカードを出します。<b>ANO!宣言後（最後の1枚）には出せません。</b>手札と山札に残っているカードが3枚以下の路線は指定できません。指定から<b>誰も出せないまま2周</b>したら、山札からその路線の駅カードが1枚自動で場に出ます。</p>
  <h3>🔊 効果音</h3><p>左上の🔊ボタンでON/OFFできます。</p>
  <h3>🤝 チーム戦（設定でON）</h3><p>赤・青の2チームに分かれ、敵と味方が交互に座ります（待合室でホストがチームバッジを押して入れ替え）。<b>味方の手札は左上に表示</b>されます。上がった人は抜けて順番が飛ばされ、<b>チーム全員が上がったら勝ち</b>。味方のANO!忘れは指摘できません。</p>
  <h3>🚧 山札切れ</h3><p>山札がなくなった時点で<b>引き分け</b>です。設定で<b>♾ 無限モード</b>をONにすると、いちばん上以外の場のカードを切り直して山札を補充し、決着がつくまで続きます。</p>
  <h3>✨ パーティクル</h3><p>自分の番ではないとき、左下の自分のアイコンをクリックするとパーティクルが出ます（ほかのプレイヤーにも見えます）。</p>
  <h3>📣 ANO!</h3><p>カードを出すと残り1枚になるときだけ、自分の番に「ANO!」ボタンを押せます（押してからカードを出す）。宣言せずに残り1枚になると、他のプレイヤーの画面に「ANO!言ってない！」ボタンが出て、押されると2枚追加。指摘される前なら、残り1枚の状態でANO!を押せばセーフです。</p>
  <h3>🔄 手札交換（設定でON/OFF）</h3><p><b>駅ナンバーの末尾が0</b>のカードを出すと、全員が手札を時計回りに隣の人へ渡します。<b>末尾が7</b>なら、出した人が相手を1人選んで手札をまるごと交換します。最後の1枚で出した場合はそのまま上がりです。</p>
  <h3>🗺 収録路線（太字は乗換駅）</h3>${lines}
  <div class="row" style="margin-top:12px"><button class="btn primary" onclick="closeModal()">閉じる</button></div></div>`);
